name: Sighten
description: >-
  Sighten was a San Francisco software company, backed by Obvious Ventures, that
  built a cloud platform for the residential and commercial solar industry —
  covering system design, proposal generation, sales, and financing workflows
  used by solar installers, dealers, and finance providers. The Sighten business
  was acquired (by GoodLeap) and folded into EverBright; the original sighten.io
  domain now redirects to goeverbright.com. EverBright operates as a residential
  solar and home-battery financing platform, connecting homeowners with local
  installers through lease and Power Purchase Agreement (PPA) products and the
  MyEverBright monitoring portal. No public developer API, developer portal, or
  API documentation is published for the Sighten or EverBright brand; a
  partner-facing platform (engine.goeverbright.com) and a protected API host
  (api.goeverbright.com, HTTP 401) exist but are not publicly documented. This
  profile records the company's current, honest public surface after enrichment.
